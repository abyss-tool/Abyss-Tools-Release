name: Validate Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 发布仓清单门禁
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 同类缺陷防御（B-01，与插件中心 hub-ci 同款收敛）：门禁脚本先过
      #    语法编译再跑业务校验 —— tools/*.py 的 NameError 级缺陷不再能
      #    以「清单数据恰好合法」的形态溜进 main。
      - name: Python syntax pre-check (py_compile all tools)
        run: python3 -m py_compile tools/*.py

      # pynacl：N-SEC-001 清单验签；pytest：tools 门禁脚本常驻单测。
      - name: Install pynacl + pytest (manifest signature verification & unit tests)
        run: pip install --quiet pynacl pytest

      - name: Validate version / patches / changelog + detached signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_manifests.py

      # ── N-ENG-010 发布说明质量门禁（B-05 收口：发布仓侧强制执行 ——
      #    原先根本不调用该脚本；与主仓 publish_release.py 发布前置门禁
      #    同一入口，主仓 tools/ 同步副本）──
      - name: Release-Notes Lint (N-ENG-010)
        run: |
          python3 tools/validate_release_notes.py version.json
          python3 tools/validate_release_notes.py changelog.json --entry-latest

      # ── 门禁脚本自身的 pytest 常驻单测：三清单一致性逐分支 fail-closed
      #    + 签名强制/错签拒收（生成密钥证明 fail-closed，不依赖 secret；
      #    绿色验签路径由发布流水线以真实材料覆盖）。
      - name: Unit tests (tools gate scripts)
        run: python3 -m pytest tests/ -v

name: Validate Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 发布仓清单门禁
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pynacl (N-SEC-001 清单验签)
        run: pip install --quiet pynacl

      - name: Validate version / patches / changelog + detached signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_manifests.py

      # ── N-ENG-010 发布说明质量门禁（B-05 收口：发布仓侧强制执行 ——
      #    原先根本不调用该脚本；与主仓 publish_release.py 发布前置门禁
      #    同一入口，主仓 tools/ 同步副本）──
      - name: Release-Notes Lint (N-ENG-010)
        run: |
          python3 tools/validate_release_notes.py version.json
          python3 tools/validate_release_notes.py changelog.json --entry-latest

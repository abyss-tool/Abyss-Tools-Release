name: Validate Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 发布仓清单门禁
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pynacl (N-SEC-001 清单验签)
        run: pip install --quiet pynacl

      - name: Validate version / patches / changelog + detached signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_manifests.py
